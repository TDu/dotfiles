# Gruvbox light256 colorscheme (256-color)
# Based on egel/tmux-gruvbox palette_gruvbox_light256 + theme_gruvbox_light256
#
# Palette (256-color names)
#   bg0=#fbf1c7 colour229   bg1=#ebdbb2 colour223   bg2=#d5c4a1 colour250
#   bg3=#bdae93 colour248   bg4=#a89984 colour246
#   fg0=#282828 colour235   fg1=#3c3836 colour237   fg2=#504945 colour239
#   fg3=#665c54 colour241   fg4=#7c6f64 colour243
#   red=#cc241d colour124   red2=#9d0006 colour88
#   green=#98971a colour106 yellow=#d79921 colour172 yellow2=#b57614 colour136
#   blue=#458588 colour66   blue2=#076678 colour24
#   purple=#b16286 colour132 aqua=#689d6a colour72  orange=#d65d0e colour166

# Enable status bar
set -g status on

# Pane border (gruvbox light palette hex for accurate colors)
# Set bg explicitly so the border fill doesn't fall back to the terminal's
# default (dark) background.
set -g pane-border-style "fg=#d5c4a1,bg=#fbf1c7"
set -g pane-active-border-style "fg=#504945,bg=#fbf1c7"

# Window / pane background (same bg for active and inactive so the pane
# background does not change when focus moves between panes)
set -g window-style "fg=colour237,bg=#fbf1c7"
set -g window-active-style "fg=colour235,bg=#fbf1c7"

# Default statusbar bg color (matches pane bg so the bar blends in).
set -g status-style "bg=#fbf1c7,fg=#b57614,dim"
set-option -g status-bg "#fbf1c7"
set-option -g status-fg "#b57614"

# Default window title colors
set-window-option -g window-status-style "fg=#665c54,bg=#fbf1c7"

# Window with an activity alert
set-window-option -g window-status-activity-style "fg=#d65d0e,bg=#fbf1c7"

# Active window title colors
set-window-option -g window-status-current-style "fg=#b57614,bg=#ebdbb2,bold"

# Message infos
set -g message-style "bg=colour250,fg=colour237"

# Writing commands (inactive)
set -g message-command-style "bg=colour241,fg=colour223"

# Pane number display
set -g display-panes-active-colour "colour239"
set -g display-panes-colour "colour223"

# Clock
set-window-option -g clock-mode-colour "colour24"

# Bell
set-window-option -g window-status-bell-style "bg=colour88,fg=colour229"

# Status bar layout
set -g status-position bottom
set -g status-justify left
set -g status-left-length 20
set -g status-right-length 50
set-window-option -g window-status-separator ""

# Left status: empty (mirrors dark theme)
set -g status-left ''

# Right status: date | time | hostname (same bg as the bar so it blends in)
set -g status-right '#[fg=#7c6f64,bg=#fbf1c7] %H:%M | %d-%m | #H'

# Current window
setw -g window-status-current-format ' #I#[fg=colour243]:#[fg=colour239]#W#[fg=colour136]#F '

# Default window
setw -g window-status-format ' #I#[fg=colour241]:#[fg=colour243]#W#[fg=colour248]#F '
